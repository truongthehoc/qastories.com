    <!-- JSON-LD Structured Data Schema for Local Photography Studio -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "PhotographyStudio",
        "name": "QA Stories Studio",
        "image": "https://qastories.com/uploads/branding/1792660593730-194552027.webp",
        "description": "Studio chụp ảnh sơ sinh newborn, thôi nôi, 100 ngày tuổi và gia đình uy tín với phong cách nghệ thuật tinh tế.",
        "url": "https://qastories.com",
        "telephone": "+84901234567",
        "priceRange": "$$",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "123 Đường ABC, Phường 1",
          "addressLocality": "Thủ Dầu Một",
          "addressRegion": "Bình Dương",
          "addressCountry": "VN"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
            "opens": "08:00",
            "closes": "20:00"
          }
        ]
      }
    </script>
  </head>
  <body class="bg-white text-gray-900 antialiased selection:bg-primary selection:text-white">
    <div id="root">
      <!-- Instant Hero Shell for Mobile FCP/LCP (< 0.8s) -->
      <div id="hero-shell" style="position:relative;width:100vw;height:100vh;background-color:#171717;overflow:hidden;">
        <!-- Top navbar shell -->
        <div style="position:absolute;top:0;left:0;right:0;height:72px;background:linear-gradient(to bottom,rgba(0,0,0,0.6),transparent);z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 16px;">
          <span style="color:#ffffff;font-family:serif;font-size:18px;font-weight:bold;letter-spacing:1px;">QA Stories</span>
          <div style="width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,0.1);"></div>
        </div>
        <!-- __HERO_SHELL_IMAGE__ -->
        <script>
          (function() {
            try {
              var isMob = window.innerWidth < 768;
              var cached = localStorage.getItem('qastories_cached_banners');
              if (cached) {
                var list = JSON.parse(cached);
                if (Array.isArray(list) && list.length > 0) {
                  var banner = null;
                  if (isMob) {
                    banner = list.find(function(b) { return b.device_type === 'mobile'; }) || list[0];
                  } else {
                    banner = list.find(function(b) { return b.device_type === 'pc' || b.device_type === 'all' || !b.device_type; }) || list[0];
                  }
                  var url = isMob && banner.image_mobile ? banner.image_mobile : (banner.image_url || banner.image);
                  if (url) {
                    var img = document.createElement('img');
                    img.src = url;
                    img.alt = banner.title || 'QA Stories';
                    img.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block;';
                    img.setAttribute('fetchpriority', 'high');
                    var container = document.getElementById('hero-shell');
                    if (container) container.insertBefore(img, container.firstChild);
                  }
                }
              }
            } catch(e) {}
          })();
        </script>
        <!-- Bottom overlay -->
        <div style="position:absolute;bottom:0;left:0;right:0;height:140px;background:linear-gradient(to top,rgba(0,0,0,0.4),transparent);pointer-events:none;"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
